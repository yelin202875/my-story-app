<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioCut — Gemini TTS Script Splitter</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0f14;
  --surface: #13161e;
  --card: #1a1d28;
  --border: rgba(255,255,255,0.07);
  --cyan: #00d4ff;
  --cyan-dim: rgba(0,212,255,0.15);
  --green: #00ff9d;
  --green-dim: rgba(0,255,157,0.12);
  --text: #e2e8f0;
  --muted: #64748b;
  --danger: #ff4d6d;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
  min-height: 100vh;
}

/* grid bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  opacity: 0.15;
}
.glow-1 { width:500px; height:500px; background:var(--cyan); top:-150px; right:-100px; }
.glow-2 { width:400px; height:400px; background:var(--green); bottom:-100px; left:-100px; }

/* ===== LAYOUT ===== */
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

header { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }

.logo {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.3rem;
}

/* ===== API KEY SECTION ===== */
.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.section-title {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.section-title::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--cyan);
  border-radius: 50%;
}

.api-row {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  flex-wrap: wrap;
}

.input-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}

.input-wrap input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.75rem 2.5rem 0.75rem 1rem;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.9rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.input-wrap input:focus { border-color: var(--cyan); }
.input-wrap input::placeholder { color: var(--muted); }

.toggle-vis {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 0;
  line-height: 1;
}

.btn {
  padding: 0.75rem 1.5rem;
  border-radius: 4px;
  border: none;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-cyan { background: var(--cyan); color: #0d0f14; }
.btn-green { background: var(--green); color: #0d0f14; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
}
.btn-outline:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }

.api-status {
  font-size: 0.78rem;
  margin-top: 0.6rem;
  display: none;
}
.api-status.ok { color: var(--green); }
.api-status.err { color: var(--danger); }

/* Voice selector */
.voice-row {
  display: flex;
  gap: 0.75rem;
  margin-top: 1rem;
  flex-wrap: wrap;
}

select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.65rem 1rem;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.85rem;
  color: var(--text);
  outline: none;
  cursor: pointer;
  flex: 1;
  min-width: 160px;
}
select:focus { border-color: var(--cyan); }

/* ===== SCRIPT SECTION ===== */
textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1rem;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 0.875rem;
  color: var(--text);
  resize: vertical;
  min-height: 220px;
  outline: none;
  line-height: 1.7;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--cyan); }
textarea::placeholder { color: var(--muted); }

.script-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.75rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.segment-count {
  font-size: 0.78rem;
  color: var(--muted);
}
.segment-count span { color: var(--cyan); font-weight: 500; }

/* ===== SEGMENTS ===== */
.segments-grid {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-top: 0.5rem;
}

.segment-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: border-color 0.2s;
}

.segment-card:hover { border-color: rgba(0,212,255,0.25); }
.segment-card.generating { border-color: rgba(0,212,255,0.5); animation: pulse 1.5s ease infinite; }
.segment-card.done { border-color: rgba(0,255,157,0.35); }
.segment-card.error { border-color: rgba(255,77,109,0.4); }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,255,0); }
  50% { box-shadow: 0 0 0 4px rgba(0,212,255,0.1); }
}

.seg-num {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--cyan);
  min-width: 2rem;
  text-align: center;
}

.seg-info { flex: 1; min-width: 0; }

.seg-timestamp {
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--cyan);
  background: var(--cyan-dim);
  border-radius: 2px;
  padding: 0.15rem 0.4rem;
  display: inline-block;
  margin-bottom: 0.3rem;
}

.seg-text {
  font-size: 0.82rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.seg-status {
  font-size: 0.75rem;
  text-align: right;
  min-width: 80px;
}

.status-idle { color: var(--muted); }
.status-gen { color: var(--cyan); }
.status-done { color: var(--green); }
.status-err { color: var(--danger); }

.seg-actions { display: flex; gap: 0.4rem; align-items: center; }

.btn-sm {
  padding: 0.4rem 0.75rem;
  font-size: 0.75rem;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: 'Instrument Sans', sans-serif;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-sm:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.btn-sm:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-sm.dl { border-color: rgba(0,255,157,0.35); color: var(--green); }

/* progress bar */
.progress-wrap {
  margin: 1rem 0;
  display: none;
}
.progress-label {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 0.4rem;
  display: flex;
  justify-content: space-between;
}
.progress-bar {
  height: 4px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 2px;
  transition: width 0.3s ease;
  width: 0%;
}

/* download all */
.dl-all-wrap {
  text-align: center;
  padding: 1rem;
  display: none;
}

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
  font-size: 0.88rem;
}

footer {
  text-align: center;
  padding: 2rem;
  border-top: 1px solid var(--border);
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-top: 2rem;
}
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="container">
  <header>
    <div class="logo">AudioCut</div>
    <div class="subtitle">Script → Per-Minute Audio Segments · Gemini TTS</div>
  </header>

  <!-- API KEY -->
  <div class="section">
    <div class="section-title">Google AI Studio — Gemini API Key</div>
    <div class="api-row">
      <div class="input-wrap">
        <input type="password" id="apiKeyInput" placeholder="AIza... API Key ထည့်ပါ">
        <button class="toggle-vis" onclick="toggleKeyVis()" title="Show/Hide">👁</button>
      </div>
      <button class="btn btn-cyan" onclick="saveApiKey()">Save</button>
      <button class="btn btn-outline" onclick="clearApiKey()">Clear</button>
    </div>
    <div class="api-status" id="apiStatus"></div>

    <div class="voice-row">
      <select id="langCode">
        <option value="my">မြန်မာ (Myanmar)</option>
        <option value="en">English</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="zh">Chinese</option>
      </select>
      <select id="voiceName">
        <option value="natural">Natural</option>
        <option value="expressive">Expressive</option>
      </select>
      <input type="range" id="speakingRate" min="0.5" max="2" step="0.1" value="1" style="flex: 1; min-width: 120px;">
      <span id="rateLabel" style="font-size: 0.85rem; color: var(--muted); min-width: 40px;">1.0x</span>
    </div>
  </div>

  <!-- SCRIPT INPUT -->
  <div class="section">
    <div class="section-title">Script Input</div>
    <textarea id="scriptInput" placeholder="(00:00 - 01:00)&#10;ပထမ စာသားကို ဒီမှာ ထည့်ပါ...&#10;&#10;(01:00 - 02:00)&#10;ဒုတိယ စာသားကို ဒီမှာ ထည့်ပါ..."></textarea>
    <div class="script-actions">
      <div class="segment-count">Segments: <span id="segCount">0</span> ပိုင်း</div>
      <div>
        <button class="btn btn-outline" onclick="loadSample()">Load Sample</button>
        <button class="btn btn-green" id="genAllBtn" onclick="generateAll()" disabled>Generate All</button>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="section">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span id="progressLabel">Generating...</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- SEGMENTS -->
  <div class="section">
    <div class="section-title">Audio Segments</div>
    <div class="segments-grid" id="segmentsGrid">
      <div class="empty-state">Script ထည့်ပြီး Parse နှိပ်ပါ →</div>
    </div>
  </div>

  <!-- DOWNLOAD ALL -->
  <div class="section dl-all-wrap" id="dlAllWrap">
    <button class="btn btn-green" onclick="downloadAll()">⬇ Download All MP3s</button>
  </div>

  <footer>
    AudioCut v2 · Powered by Google AI Studio (Gemini) · ပြင်ဆင်ခြင်း အခမဲ့
  </footer>
</div>

<audio id="audioEl"></audio>

<script>
let apiKey = '';
let segments = [];
let audioBlobs = {};

// ===== API KEY MANAGEMENT =====
function toggleKeyVis() {
  const inp = document.getElementById('apiKeyInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    showApiStatus('❌ API Key ကို ထည့်ပါ', false);
    return;
  }
  apiKey = key;
  localStorage.setItem('gemini_api_key', key);
  showApiStatus('✓ API Key သိမ်းဆည်းပြီး', true);
  document.getElementById('genAllBtn').disabled = segments.length === 0;
}

function clearApiKey() {
  apiKey = '';
  document.getElementById('apiKeyInput').value = '';
  localStorage.removeItem('gemini_api_key');
  showApiStatus('API Key ဖျက်ပြီး', false);
  document.getElementById('genAllBtn').disabled = true;
}

function showApiStatus(msg, ok) {
  const el = document.getElementById('apiStatus');
  el.textContent = msg;
  el.className = 'api-status ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}

// ===== SCRIPT PARSING =====
function parseScript() {
  const raw = document.getElementById('scriptInput').value;
  segments = [];
  audioBlobs = {};
  const regex = /\((\d+:\d+)\s*-\s*(\d+:\d+)\)\s*\n([\s\S]*?)(?=\(\d+:\d+|$)/g;
  let match;
  while ((match = regex.exec(raw)) !== null) {
    const text = match[3].trim();
    if (text) {
      segments.push({ start: match[1], end: match[2], text });
    }
  }
  renderSegments();
  document.getElementById('segCount').textContent = segments.length;
  document.getElementById('genAllBtn').disabled = segments.length === 0 || !apiKey;
  document.getElementById('dlAllWrap').style.display = 'none';
}

function renderSegments() {
  const grid = document.getElementById('segmentsGrid');
  if (segments.length === 0) {
    grid.innerHTML = '<div class="empty-state">Script ထည့်ပြီး Parse နှိပ်ပါ →</div>';
    return;
  }
  grid.innerHTML = segments.map((seg, i) => `
    <div class="segment-card" id="card-${i}">
      <div class="seg-num">${i + 1}</div>
      <div class="seg-info">
        <div class="seg-timestamp">${seg.start} – ${seg.end}</div>
        <div class="seg-text">${seg.text.substring(0, 90)}${seg.text.length > 90 ? '…' : ''}</div>
      </div>
      <div class="seg-status status-idle" id="status-${i}">⏳ စောင့်ဆိုင်း</div>
      <div class="seg-actions">
        <button class="btn-sm" id="play-${i}" onclick="playSegment(${i})" disabled>▶</button>
        <button class="btn-sm dl" id="dl-${i}" onclick="downloadSegment(${i})" disabled>⬇</button>
        <button class="btn-sm" onclick="generateSingle(${i})" id="gen-${i}">Generate</button>
      </div>
    </div>
  `).join('');
}

// ===== GEMINI TTS CALL =====
async function callGeminiTTS(text) {
  const lang = document.getElementById('langCode').value;
  const voice = document.getElementById('voiceName').value;
  const rate = parseFloat(document.getElementById('speakingRate').value);

  if (!apiKey) throw new Error('API key မရှိပါ');

  // Gemini API endpoint for text-to-speech
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

  const prompt = `Generate high-quality speech audio for the following text in ${lang} language with ${voice} voice style and ${rate}x speaking rate. Return ONLY the base64-encoded MP3 audio data, no other text or explanation.

Text: "${text}"`;

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{
        parts: [{ text: prompt }]
      }],
      generationConfig: { temperature: 0.3, maxOutputTokens: 1024 }
    })
  });

  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    const msg = errBody.error?.message || `HTTP ${res.status}`;
    throw new Error(msg);
  }

  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  
  if (!raw) throw new Error('AI မှ response မရပါ');

  // Extract base64 from response (it might be wrapped in markdown code blocks)
  const clean = raw.replace(/```[\s\S]*?```/g, '').trim();
  
  // Validate base64
  if (!/^[A-Za-z0-9+/=]+$/.test(clean)) {
    throw new Error('Invalid audio data from Gemini');
  }

  // Convert base64 to blob
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: 'audio/mp3' });
}

// ===== GENERATE SINGLE =====
async function generateSingle(i) {
  if (!apiKey) { alert('API key ထည့်ပြီး Save နှိပ်ပါ'); return; }
  const seg = segments[i];
  setSegState(i, 'generating', '🔄 Generate နေသည်…');
  try {
    const blob = await callGeminiTTS(seg.text);
    audioBlobs[i] = blob;
    setSegState(i, 'done', '✓ ပြီးပြီ');
    document.getElementById(`play-${i}`).disabled = false;
    document.getElementById(`dl-${i}`).disabled = false;
    checkAllDone();
  } catch (e) {
    setSegState(i, 'error', '✗ Error');
    console.error(e);
  }
}

// ===== GENERATE ALL =====
async function generateAll() {
  if (!apiKey) { alert('API key ထည့်ပြီး Save နှိပ်ပါ'); return; }
  document.getElementById('genAllBtn').disabled = true;
  const wrap = document.getElementById('progressWrap');
  wrap.style.display = 'block';
  let done = 0;

  for (let i = 0; i < segments.length; i++) {
    updateProgress(i, segments.length);
    setSegState(i, 'generating', '🔄 Generate နေသည်…');
    try {
      const blob = await callGeminiTTS(segments[i].text);
      audioBlobs[i] = blob;
      setSegState(i, 'done', '✓ ပြီးပြီ');
      document.getElementById(`play-${i}`).disabled = false;
      document.getElementById(`dl-${i}`).disabled = false;
      done++;
    } catch (e) {
      setSegState(i, 'error', '✗ Error: ' + e.message.substring(0, 30));
    }
    // small delay to avoid rate limiting
    if (i < segments.length - 1) await sleep(800);
  }

  updateProgress(segments.length, segments.length);
  document.getElementById('progressLabel').textContent = `✓ ${done}/${segments.length} ပြီးပြီ`;
  document.getElementById('genAllBtn').disabled = false;
  if (done > 0) document.getElementById('dlAllWrap').style.display = 'block';
}

function updateProgress(current, total) {
  const pct = Math.round((current / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressLabel').textContent = `Generating ${current + 1} / ${total}…`;
}

function setSegState(i, state, msg) {
  const card = document.getElementById(`card-${i}`);
  const status = document.getElementById(`status-${i}`);
  card.className = 'segment-card ' + state;
  status.className = `seg-status status-${state === 'generating' ? 'gen' : state === 'done' ? 'done' : 'err'}`;
  status.textContent = msg;
}

// ===== PLAY / DOWNLOAD =====
let currentAudio = null;

function playSegment(i) {
  if (!audioBlobs[i]) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const url = URL.createObjectURL(audioBlobs[i]);
  currentAudio = new Audio(url);
  currentAudio.play();
}

function downloadSegment(i) {
  if (!audioBlobs[i]) return;
  const seg = segments[i];
  const url = URL.createObjectURL(audioBlobs[i]);
  const a = document.createElement('a');
  a.href = url;
  a.download = `segment_${String(i+1).padStart(2,'0')}_${seg.start.replace(':','m')}s-${seg.end.replace(':','m')}s.mp3`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadAll() {
  const keys = Object.keys(audioBlobs);
  if (keys.length === 0) return;
  keys.forEach(i => { setTimeout(() => downloadSegment(parseInt(i)), parseInt(i) * 300); });
}

function checkAllDone() {
  const allDone = segments.every((_, i) => !!audioBlobs[i]);
  if (allDone) document.getElementById('dlAllWrap').style.display = 'block';
}

// ===== SAMPLE SCRIPT =====
function loadSample() {
  document.getElementById('scriptInput').value = `(00:00 - 01:00)

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== SPEAKING RATE LABEL UPDATE =====
document.getElementById('speakingRate').addEventListener('input', function() {
  document.getElementById('rateLabel').textContent = this.value + 'x';
});

// ===== INIT =====
window.addEventListener('load', () => {
  const saved = localStorage.getItem('gemini_api_key');
  if (saved) {
    apiKey = saved;
    document.getElementById('apiKeyInput').value = saved;
    showApiStatus('✓ Saved API key ထည့်ပြီး', true);
  }

  // auto-parse on script change (debounced)
  let t;
  document.getElementById('scriptInput').addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(parseScript, 800);
  });
});
