<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ဇာတ်လမ်း Video ဖန်တီးသူ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@300;400;700&display=swap');
:root {
  --gold: #e8c97a; --deep: #080810; --panel: #0f0f1e;
  --border: rgba(232,201,122,0.18); --text: #e8e0d0;
  --muted: #7a7590; --green: #5ab87a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--deep); color: var(--text);
  font-family: 'Noto Sans Myanmar', sans-serif; min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 15% 0%, rgba(196,94,62,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(232,201,122,0.07) 0%, transparent 55%);
}
header { text-align: center; padding: 2.5rem 1rem 1.5rem; border-bottom: 1px solid var(--border); }
header h1 { font-size: 1.9rem; color: var(--gold); font-weight: 700; }
header p { color: var(--muted); margin-top: 0.4rem; font-size: 0.88rem; }
.wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.2rem; display: flex; flex-direction: column; gap: 1.4rem; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; }
.card h2 { font-size: 0.95rem; color: var(--gold); margin-bottom: 1.1rem; }

/* Upload button style */
.upload-btn {
  display: block; width: 100%;
  background: rgba(232,201,122,0.08);
  border: 2px dashed var(--border);
  border-radius: 12px; padding: 2rem 1rem;
  text-align: center; cursor: pointer;
  transition: all 0.2s; color: var(--text);
  font-family: inherit; font-size: 0.9rem;
}
.upload-btn:hover { border-color: var(--gold); background: rgba(232,201,122,0.06); }
.upload-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
.file-name { color: var(--gold); margin-top: 0.5rem; font-size: 0.88rem; word-break: break-all; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%; padding: 0.85rem 1.5rem; border-radius: 9px; border: none;
  cursor: pointer; font-family: inherit; font-size: 0.92rem; font-weight: 700;
  transition: all 0.2s; margin-top: 1.1rem;
}
.btn-gold { background: var(--gold); color: #08080e; }
.btn-gold:hover { background: #f0d98a; transform: translateY(-1px); }
.btn-gold:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.status { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.84rem; display: none; margin-top: 1rem; }
.status.info { background: rgba(232,201,122,0.08); border: 1px solid rgba(232,201,122,0.25); color: var(--gold); }
.status.error { background: rgba(196,94,62,0.1); border: 1px solid rgba(196,94,62,0.3); color: #e07a5f; }
.status.ok { background: rgba(90,184,122,0.1); border: 1px solid rgba(90,184,122,0.3); color: var(--green); }

.seg-list { display: flex; flex-direction: column; gap: 0.7rem; }
.seg-item {
  display: grid; grid-template-columns: 36px 1fr 90px;
  gap: 0.8rem; align-items: center;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem;
}
.seg-num {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--gold); color: #08080e;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.82rem;
}
.seg-text { font-size: 0.87rem; line-height: 1.55; margin-bottom: 0.2rem; }
.seg-time { font-size: 0.71rem; color: var(--muted); }
.seg-thumb { width: 88px; height: 62px; border-radius: 7px; object-fit: cover; border: 1px dashed var(--border); }

#player { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; display: none; }
#pl-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
#pl-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 1.2rem 1.4rem;
}
#pl-text { font-size: 1rem; line-height: 1.75; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
.pl-bar-wrap { display: flex; align-items: center; gap: 0.7rem; margin-top: 0.6rem; }
.pl-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
.pl-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.25s linear; }
#pl-count { font-size: 0.72rem; color: rgba(255,255,255,0.55); white-space: nowrap; }
.pl-btns { display: flex; gap: 0.4rem; margin-top: 0.55rem; }
.pl-btn { background: rgba(255,255,255,0.14); border: none; color: #fff; border-radius: 6px; padding: 0.45rem 0.9rem; cursor: pointer; font-family: inherit; font-size: 0.82rem; }
.pl-btn:hover { background: rgba(255,255,255,0.24); }

.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.65s linear infinite; vertical-align: middle; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }
audio { display: none; }
.settings-panel { display:none; }
.settings-panel.open { display:block; }
.key-input { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border);
  border-radius:8px; padding:0.6rem 0.9rem; color:var(--text); font-family:inherit;
  font-size:0.85rem; margin-top:0.4rem; }
.key-input:focus { outline:none; border-color:var(--gold); }
.key-label { font-size:0.8rem; color:var(--muted); margin-top:0.8rem; display:block; }
.settings-toggle { position:fixed; top:1rem; right:1rem; background:rgba(232,201,122,0.15);
  border:1px solid var(--border); color:var(--gold); border-radius:8px; padding:0.4rem 0.8rem;
  cursor:pointer; font-family:inherit; font-size:0.82rem; z-index:100; }
.settings-toggle:hover { background:rgba(232,201,122,0.25); }
.key-saved { color:var(--green); font-size:0.78rem; margin-top:0.4rem; display:none; }

</style>
</head>
<body>

<header>
  <h1>🎬 ဇာတ်လမ်း Video ဖန်တီးသူ</h1>
  <p>အသံဖိုင် upload လုပ်တာနဲ့ — AI က အသံနဲ့ ကိုက်ညီတဲ့ ပုံတွေ အလိုအလျောက် ရှာပေးမည်</p>
</header>


<button class="settings-toggle" onclick="toggleSettings()">⚙️ Settings</button>

<div class="wrap" id="settings-wrap" style="display:none">
  <div class="card">
    <h2>⚙️ API Keys သတ်မှတ်ရန်</h2>
    <span class="key-label">Gemini API Key <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--gold);font-size:0.75rem;">(ဒီမှာရယူပါ)</a></span>
    <input class="key-input" id="inp-gemini" type="password" placeholder="AIzaSy..." />
    <span class="key-label">Pexels API Key <a href="https://www.pexels.com/api/" target="_blank" style="color:var(--gold);font-size:0.75rem;">(ဒီမှာရယူပါ)</a></span>
    <input class="key-input" id="inp-pexels" type="password" placeholder="optional — မရှိရင် random ပုံ သုံးမည်" />
    <button class="btn btn-gold" onclick="saveKeys()" style="margin-top:1rem;">💾 သိမ်းမည်</button>
    <div class="key-saved" id="key-saved">✅ သိမ်းပြီးပါပြီ!</div>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <h2>🎵 အသံဖိုင် ရွေးပါ</h2>

    <button class="upload-btn" onclick="document.getElementById('audio-input').click()">
      <span class="upload-icon">🎙</span>
      MP3, WAV, M4A ဖိုင် ရွေးရန် နှိပ်ပါ
      <div class="file-name" id="file-name">ဖိုင် မရွေးရသေးပါ</div>
    </button>
    <input type="file" id="audio-input" accept="audio/*" style="display:none" onchange="onFileChange(this)">

    <button class="btn btn-gold" id="process-btn" onclick="processAudio()" disabled>
      ✨ AI နဲ့ ပုံရှာပြီး Video ဆောက်ရန်
    </button>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="seg-card" style="display:none">
    <h2>📋 Segments <span id="seg-count" style="font-size:0.78rem;color:var(--muted);margin-left:0.4rem"></span></h2>
    <div class="seg-list" id="seg-list"></div>
  </div>

  <div class="card" id="player-card" style="display:none">
    <h2>▶ Video Player</h2>
    <div id="player">
      <img id="pl-img" src="" alt="">
      <div id="pl-overlay">
        <div id="pl-text"></div>
        <div class="pl-bar-wrap">
          <div class="pl-bar"><div class="pl-fill" id="pl-fill"></div></div>
          <span id="pl-count">0/0</span>
        </div>
        <div class="pl-btns">
          <button class="pl-btn" onclick="prevSeg()">⏮ နောက်ဆုတ်</button>
          <button class="pl-btn" id="pause-btn" onclick="togglePause()">⏸ ရပ်</button>
          <button class="pl-btn" onclick="nextSeg()">⏭ ရှေ့တိုး</button>
        </div>
      </div>
    </div>
  </div>

</div>

<audio id="audio-el"></audio>

<script>
// ── API Keys from localStorage ─────────────────────────
function getKeys() {
  return {
    gemini: localStorage.getItem('sv_gemini_key') || '',
    pexels: localStorage.getItem('sv_pexels_key') || ''
  };
}

let segments = [];
let curIdx = 0;
let paused = false;
let audioFile = null;
const audioEl = document.getElementById('audio-el');

function onFileChange(input) {
  const f = input.files[0];
  if (f) {
    audioFile = f;
    document.getElementById('file-name').textContent = '✅ ' + f.name;
    document.getElementById('process-btn').disabled = false;
  }
}

async function processAudio() {
  if (!audioFile) return showStatus('အသံဖိုင် ရွေးပါ', 'error');
  const keys = getKeys();
  if (!keys.gemini) return showStatus('❌ Gemini API Key မရှိပါ။ ⚙️ Settings မှာ ထည့်ပါ။', 'error');

  const btn = document.getElementById('process-btn');
  btn.disabled = true;

  showStatus('<span class="spinner"></span> Gemini AI နဲ့ အသံကို စာပြောင်းနေသည်...', 'info');

  let segs;
  try {
    segs = await transcribeWithGemini(audioFile);
  } catch(e) {
    showStatus('Gemini error: ' + e.message, 'error');
    btn.disabled = false; return;
  }

  if (!segs || segs.length === 0) {
    showStatus('Transcript ထုတ်မရပါ။ Audio စစ်ဆေးပါ။', 'error');
    btn.disabled = false; return;
  }

  segments = segs;
  renderSegments();

  for (let i = 0; i < segments.length; i++) {
    showStatus(`<span class="spinner"></span> ပုံ ${i+1}/${segments.length} ရှာနေသည် — "${segments[i].keyword}"`, 'info');
    segments[i].imageUrl = await fetchPexels(segments[i].keyword);
    updateThumb(i);
  }

  showStatus('✅ ပြီးပါပြီ! Player မှာ Play နှိပ်ပါ', 'ok');
  btn.disabled = false;
  startPlayer();
}

async function transcribeWithGemini(file) {
  if (file.size > 20 * 1024 * 1024) {
    throw new Error('ဖိုင် အရွယ်အစား 20MB ထက် ကြီးနေသည်။ သေးငယ်သော ဖိုင် သုံးပါ။');
  }
  showStatus('<span class="spinner"></span> ဖိုင် ဖတ်နေသည်...', 'info');
  const base64 = await fileToBase64(file);
  const mimeType = file.type || 'audio/mpeg';

  const prompt = `Transcribe this audio. The language may be Myanmar (Burmese).
Return ONLY a valid JSON array. No markdown, no backticks, no explanation.
Each object must have:
- "text": spoken words in original language
- "start": start time in seconds (number)
- "end": end time in seconds (number)
- "keyword": 2-3 English words for image search describing the visual scene

Split into 5-10 second segments. Example:
[{"text":"သစ်ပင်ပေါ်မှာ သရဲတစ်ကောင်","start":0,"end":5,"keyword":"ghost on tree night"},{"text":"ကလေးငယ်ကြောက်သွားသည်","start":5,"end":10,"keyword":"scared child dark forest"}]`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${getKeys().gemini}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [
          { inline_data: { mime_type: mimeType, data: base64 } },
          { text: prompt }
        ]}],
        generationConfig: { temperature: 0.1, maxOutputTokens: 4096 }
      })
    }
  );

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'HTTP ' + res.status);
  }

  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const clean = raw.replace(/```json|```/g, '').trim();

  try {
    return JSON.parse(clean);
  } catch {
    const match = clean.match(/\[[\s\S]*\]/);
    if (match) return JSON.parse(match[0]);
    throw new Error('JSON parse မရဘူး');
  }
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('File read failed'));
    r.readAsDataURL(file);
  });
}

async function fetchPexels(keyword) {
  try {
    const r = await fetch(
      `https://api.pexels.com/v1/search?query=${encodeURIComponent(keyword)}&per_page=1&orientation=landscape`,
      { headers: { Authorization: getKeys().pexels } }
    );
    if (!r.ok) throw new Error();
    const d = await r.json();
    return d.photos?.[0]?.src?.large || fallback(keyword);
  } catch {
    return fallback(keyword);
  }
}

function fallback(k) {
  return `https://picsum.photos/seed/${encodeURIComponent(k)}/1280/720`;
}

function fmt(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function renderSegments() {
  document.getElementById('seg-card').style.display = 'block';
  document.getElementById('seg-count').textContent = segments.length + ' segments';
  document.getElementById('seg-list').innerHTML = segments.map((s, i) => `
    <div class="seg-item" id="seg-${i}">
      <div class="seg-num">${i+1}</div>
      <div>
        <div class="seg-text">${s.text}</div>
        <div class="seg-time">⏱ ${fmt(s.start)}–${fmt(s.end)} | 🔍 ${s.keyword}</div>
      </div>
      <img class="seg-thumb" id="thumb-${i}" src="${fallback(s.keyword)}" alt="">
    </div>
  `).join('');
}

function updateThumb(i) {
  const el = document.getElementById('thumb-'+i);
  if (el && segments[i].imageUrl) el.src = segments[i].imageUrl;
}

// ── Player ─────────────────────────────────────────────
function startPlayer() {
  document.getElementById('player-card').style.display = 'block';
  document.getElementById('player').style.display = 'block';
  document.getElementById('player-card').scrollIntoView({ behavior: 'smooth' });

  audioEl.src = URL.createObjectURL(audioFile);
  curIdx = 0; paused = false;
  audioEl.addEventListener('timeupdate', onTime);
  audioEl.play();
  renderFrame(0);
}

function onTime() {
  const t = audioEl.currentTime;
  let idx = segments.findIndex((s, i) => {
    const nx = segments[i+1];
    return t >= s.start && (!nx || t < nx.start);
  });
  if (idx < 0) idx = segments.length - 1;
  if (idx !== curIdx) { curIdx = idx; renderFrame(curIdx); }
  const pct = audioEl.duration ? (t / audioEl.duration * 100) : 0;
  document.getElementById('pl-fill').style.width = pct + '%';
  document.getElementById('pl-count').textContent = `${curIdx+1}/${segments.length}`;
}

function renderFrame(i) {
  if (i < 0 || i >= segments.length) return;
  const s = segments[i];
  document.getElementById('pl-img').src = s.imageUrl || fallback(s.keyword);
  document.getElementById('pl-text').textContent = s.text;
  document.getElementById('pl-count').textContent = `${i+1}/${segments.length}`;
}

function prevSeg() {
  curIdx = Math.max(0, curIdx-1);
  audioEl.currentTime = segments[curIdx].start;
  renderFrame(curIdx);
}

function nextSeg() {
  curIdx = Math.min(segments.length-1, curIdx+1);
  audioEl.currentTime = segments[curIdx].start;
  renderFrame(curIdx);
}

function togglePause() {
  paused = !paused;
  paused ? audioEl.pause() : audioEl.play();
  document.getElementById('pause-btn').textContent = paused ? '▶ ဆက်ကြည့်' : '⏸ ရပ်';
}


function toggleSettings() {
  const w = document.getElementById('settings-wrap');
  const showing = w.style.display !== 'none';
  w.style.display = showing ? 'none' : 'block';
  if (!showing) {
    const k = getKeys();
    if (k.gemini) document.getElementById('inp-gemini').value = k.gemini;
    if (k.pexels) document.getElementById('inp-pexels').value = k.pexels;
  }
}

function saveKeys() {
  const g = document.getElementById('inp-gemini').value.trim();
  const p = document.getElementById('inp-pexels').value.trim();
  if (g) localStorage.setItem('sv_gemini_key', g);
  if (p) localStorage.setItem('sv_pexels_key', p);
  const saved = document.getElementById('key-saved');
  saved.style.display = 'block';
  setTimeout(() => { saved.style.display = 'none'; document.getElementById('settings-wrap').style.display = 'none'; }, 1500);
}

// Show settings if no key saved
window.addEventListener('load', () => {
  if (!getKeys().gemini) {
    document.getElementById('settings-wrap').style.display = 'block';
  }
});

function showStatus(msg, type) {
  const s = document.getElementById('status');
  s.style.display = 'block'; s.className = 'status '+type; s.innerHTML = msg;
}
</script>
</body>
</html>
